<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Waste Sorter</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <h1>Waste Sorter</h1>
    <p>Upload or snap a photo of an item and get disposal guidance.</p>

    <input type="file" id="fileInput" accept="image/*" />
    <button id="predictBtn">Predict</button>

    <section id="result" hidden>
      <h2>Prediction</h2>
      <p id="label"></p>
      <p id="score"></p>
      <p id="guidance"></p>
    </section>

    <section>
      <h2>History</h2>
      <ul id="history"></ul>
    </section>
  </main>
  <script src="/main.js"></script>
</body>
</html>
